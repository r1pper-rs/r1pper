[package]
name = "r1pper"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
console = "0.16"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
toml = "0.9"
extism = { version = "=1.20.0", default-features = false, features = ["http", "wasmtime-default-features"] }
indicatif = "0.18"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
tempfile = "3.27"
url = "2.5"
librespot = { git = "https://github.com/librespot-org/librespot.git", branch = "dev", default-features = false, features = ["rustls-tls-native-roots"] }
librespot-oauth = { git = "https://github.com/librespot-org/librespot.git", branch = "dev", package = "librespot-oauth", default-features = false, features = ["rustls-tls-native-roots"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
soulseek-rs-lib = "18.0.0"
