name: Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:

env:
  BINARY_NAME: r1pper
  BINARY_NAME_GUI: r1pper-gui

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install --yes libasound2-dev libegl1-mesa-dev libwayland-dev libxkbcommon-dev pkg-config

      - name: Build binaries
        run: cargo build --release --workspace

      - name: Stage binaries
        run: |
          mkdir -p dist
          cp target/release/${{ env.BINARY_NAME }} dist/${{ env.BINARY_NAME }}-linux-x86_64
          cp target/release/${{ env.BINARY_NAME_GUI }} dist/${{ env.BINARY_NAME_GUI }}-linux-x86_64

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY_NAME }}-linux-x86_64
          if-no-files-found: error
          path: dist/*

  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Build binaries
        run: cargo build --release --workspace

      - name: Stage binaries
        run: |
          mkdir -p dist
          cp target/release/${{ env.BINARY_NAME }} dist/${{ env.BINARY_NAME }}-macos-aarch64
          cp target/release/${{ env.BINARY_NAME_GUI }} dist/${{ env.BINARY_NAME_GUI }}-macos-aarch64

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY_NAME }}-macos-aarch64
          if-no-files-found: error
          path: dist/*

  build-macos-installer:
    runs-on: macos-14
    needs: [build-macos]
    steps:
      - uses: actions/checkout@v4

      - name: Download macOS binaries
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.BINARY_NAME }}-macos-aarch64
          path: dist

      - name: Extract version
        id: get_version
        run: |
          VERSION=$(sed -nE 's/^version[[:space:]]*=[[:space:]]*"([^"]+)"/\1/p' Cargo.toml | head -n1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Assemble pkg payload
        run: |
          mkdir -p pkgroot/usr/local/bin
          cp dist/${{ env.BINARY_NAME }}-macos-aarch64 pkgroot/usr/local/bin/${{ env.BINARY_NAME }}
          cp dist/${{ env.BINARY_NAME_GUI }}-macos-aarch64 pkgroot/usr/local/bin/${{ env.BINARY_NAME_GUI }}
          chmod +x pkgroot/usr/local/bin/*

      - name: Build component package
        run: |
          mkdir -p dist/pkg
          pkgbuild \
            --root pkgroot \
            --identifier org.ripperdevs.r1pper \
            --version ${{ steps.get_version.outputs.version }} \
            --install-location / \
            dist/pkg/r1pper-component.pkg

      - name: Build product package
        run: |
          productbuild \
            --distribution packaging/macos/distribution.xml \
            --package-path dist/pkg \
            dist/pkg/${{ env.BINARY_NAME }}-macos-aarch64.pkg

      - name: Upload pkg
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY_NAME }}-macos-installer-aarch64
          if-no-files-found: error
          path: dist/pkg/${{ env.BINARY_NAME }}-macos-aarch64.pkg

  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Build binaries
        run: cargo build --release --workspace

      - name: Stage binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item "target/release/${{ env.BINARY_NAME }}.exe" "dist/${{ env.BINARY_NAME }}-windows-x86_64.exe"
          Copy-Item "target/release/${{ env.BINARY_NAME_GUI }}.exe" "dist/${{ env.BINARY_NAME_GUI }}-windows-x86_64.exe"

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY_NAME }}-windows-x86_64
          if-no-files-found: error
          path: dist/*

  build-windows-installer:
    runs-on: windows-2022
    needs: [build-windows]
    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: r1pper
            choco_id: r1pper
          - crate: r1pper-gui
            choco_id: r1pper-gui
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows binaries
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.BINARY_NAME }}-windows-x86_64
          path: dist

      - uses: dtolnay/rust-toolchain@stable

      - name: Install WiX Toolset and cargo-wix
        shell: pwsh
        run: |
          choco install wixtoolset -y
          cargo install cargo-wix --locked

      - name: Restore binaries for cargo-wix
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path target/release
          Copy-Item "dist/${{ env.BINARY_NAME }}-windows-x86_64.exe" "target/release/${{ env.BINARY_NAME }}.exe"
          Copy-Item "dist/${{ env.BINARY_NAME_GUI }}-windows-x86_64.exe" "target/release/${{ env.BINARY_NAME_GUI }}.exe"

      - name: Build MSI installer (${{ matrix.crate }})
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/msi
          cargo wix --package ${{ matrix.crate }} --nocapture --output dist/msi/
          $msi = Get-ChildItem dist/msi/*.msi | Select-Object -First 1
          Rename-Item $msi.FullName "${{ matrix.choco_id }}-windows-x86_64.msi"

      - name: Extract version
        id: get_version
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.+)"$').Matches[0].Groups[1].Value
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Assemble Chocolatey package (${{ matrix.crate }})
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path choco/tools
          Copy-Item packaging/chocolatey/${{ matrix.choco_id }}/${{ matrix.choco_id }}.nuspec choco/${{ matrix.choco_id }}.nuspec
          Copy-Item packaging/chocolatey/${{ matrix.choco_id }}/tools/*.ps1 choco/tools/
          Copy-Item "dist/msi/${{ matrix.choco_id }}-windows-x86_64.msi" "choco/tools/${{ matrix.choco_id }}.msi"

      - name: Pack Chocolatey package (${{ matrix.crate }})
        shell: pwsh
        run: choco pack choco/${{ matrix.choco_id }}.nuspec --version ${{ steps.get_version.outputs.version }} --outputdirectory dist/choco

      - name: Upload MSI + Chocolatey package (${{ matrix.crate }})
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.choco_id }}-windows-installer-x86_64
          if-no-files-found: error
          path: |
            dist/msi/${{ matrix.choco_id }}-windows-x86_64.msi
            dist/choco/*.nupkg

      - name: Push to Chocolatey (${{ matrix.crate }})
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
        run: |
          $pkg = Get-ChildItem dist/choco/*.nupkg | Select-Object -First 1
          choco apikey --api-key $env:CHOCOLATEY_API_KEY --source https://push.chocolatey.org/
          choco push $pkg.FullName --source https://push.chocolatey.org/

  build-flatpak:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Generate cargo vendor sources for Flatpak
        run: |
          python3 -m pip install --user aiohttp toml
          curl -sSL -o flatpak-cargo-generator.py https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/master/cargo/flatpak-cargo-generator.py
          python3 flatpak-cargo-generator.py Cargo.lock -o packaging/flatpak/generated-sources.json

      - name: Point manifest at this ref
        run: sed -i "s|tag: .*|tag: ${{ github.ref_name }}|" packaging/flatpak/io.github.ripper-rs.r1pper.yml

      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install --yes flatpak flatpak-builder
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install --system --noninteractive flathub \
            org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08 org.freedesktop.Sdk.Extension.rust-stable//24.08

      - name: Build flatpak
        # Builds Rust from source inside the sandbox using the vendored deps from
        # generated-sources.json — no prebuilt binaries, no network access needed.
        run: flatpak-builder --force-clean --repo=repo build-dir packaging/flatpak/io.github.ripper-rs.r1pper.yml

      - name: Bundle single-file flatpak
        run: |
          mkdir -p dist/flatpak
          flatpak build-bundle repo dist/flatpak/${{ env.BINARY_NAME }}-linux-x86_64.flatpak io.github.ripper-rs.r1pper

      - name: Upload flatpak bundle
        # Attached to the GitHub release for people who don't use Flathub:
        #   flatpak install ./r1pper-linux-x86_64.flatpak
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY_NAME }}-linux-flatpak
          if-no-files-found: error
          path: dist/flatpak/*.flatpak

  publish-flathub:
    runs-on: ubuntu-24.04
    needs: [build-flatpak]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Generate cargo vendor sources for Flatpak
        run: |
          python3 -m pip install --user aiohttp toml
          curl -sSL -o flatpak-cargo-generator.py https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/master/cargo/flatpak-cargo-generator.py
          python3 flatpak-cargo-generator.py Cargo.lock -o generated-sources.json

      - name: Point manifest at this tag
        run: |
          sed -i "s|tag: .*|tag: ${{ github.ref_name }}|" packaging/flatpak/io.github.ripper-rs.r1pper.yml

      - name: Checkout Flathub metadata repo
        uses: actions/checkout@v4
        with:
          repository: flathub/io.github.ripper-rs.r1pper
          ssh-key: ${{ secrets.FLATHUB_DEPLOY_KEY }}
          path: flathub-repo

      - name: Push manifest + vendor sources to Flathub
        run: |
          cp packaging/flatpak/io.github.ripper-rs.r1pper.yml flathub-repo/
          cp generated-sources.json flathub-repo/
          cd flathub-repo
          git config user.name "r1pper release bot"
          git config user.email "actions@users.noreply.github.com"
          git add io.github.ripper-rs.r1pper.yml generated-sources.json
          if git diff --cached --quiet; then
            echo "No manifest changes for this release"
          else
            git commit -m "Release ${{ github.ref_name }}"
            git push origin HEAD:master
          fi

  release:
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-macos, build-macos-installer, build-windows-installer, build-flatpak]
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.BINARY_NAME }}-linux-x86_64
          path: prepare/

      - name: Download Linux flatpak bundle
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.BINARY_NAME }}-linux-flatpak
          path: prepare/

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.BINARY_NAME }}-macos-aarch64
          path: prepare/

      - name: Download macOS installer pkg
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.BINARY_NAME }}-macos-installer-aarch64
          path: prepare/

      - name: Download Windows binaries
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.BINARY_NAME }}-windows-x86_64
          path: prepare/

      - name: Download CLI installer + Chocolatey package
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.BINARY_NAME }}-windows-installer-x86_64
          path: prepare/

      - name: Download GUI installer + Chocolatey package
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.BINARY_NAME_GUI }}-windows-installer-x86_64
          path: prepare/

      - name: Prepare release assets
        run: |
          mkdir -p upload
          find prepare -type f \( -name "*.msi" -o -name "*.nupkg" -o -name "*.pkg" -o -name "*.flatpak" -o -name "${{ env.BINARY_NAME }}-*" -o -name "${{ env.BINARY_NAME_GUI }}-*" \) -exec cp {} upload/ \;

      - name: Extract version
        id: get_version
        run: |
          VERSION=$(sed -nE 's/^version[[:space:]]*=[[:space:]]*"([^"]+)"/\1/p' Cargo.toml | head -n1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.get_version.outputs.version }}
          tag_name: v${{ steps.get_version.outputs.version }}
          files: upload/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          draft: true
